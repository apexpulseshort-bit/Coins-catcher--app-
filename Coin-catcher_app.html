<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coin Catcher - Mobile Arcade</title>
  <meta name="theme-color" content="#070a13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #05070d;
      color: #fff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #070a13;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      flex: 1;
    }
    /* Top HUD / Scoreboard */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(7,10,19,0.94) 0%, rgba(7,10,19,0) 100%);
      pointer-events: none;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
    }
    .hud-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #94a3b8;
      font-weight: 700;
    }
    .hud-value {
      font-size: 28px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    .score-val {
      color: #facc15;
      text-shadow: 0 0 16px rgba(250, 204, 21, 0.6);
    }
    .high-val {
      color: #38bdf8;
      font-size: 22px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .mute-btn {
      pointer-events: auto;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 9999px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }
    .mute-btn:active {
      transform: scale(0.92);
      background: rgba(51, 65, 85, 0.9);
    }
    /* Touch Controls for Android Thumb Play */
    #touch-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 16px 18px;
      pointer-events: none;
      z-index: 20;
    }
    .touch-btn {
      pointer-events: auto;
      width: 104px;
      height: 104px;
      border-radius: 26px;
      background: rgba(14, 165, 233, 0.14);
      border: 2px solid rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      transition: transform 0.1s, background 0.1s, border-color 0.1s;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(56, 189, 248, 0.12);
      cursor: pointer;
    }
    .touch-btn-icon {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
    }
    .touch-btn-sub {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      opacity: 0.8;
      margin-top: 4px;
    }
    .touch-btn:active {
      transform: scale(0.92);
      background: rgba(14, 165, 233, 0.38);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
    }
    /* Modal Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: rgba(7, 10, 19, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .game-logo {
      width: 76px;
      height: 76px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, #fef08a 0%, #facc15 45%, #b45309 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #fff;
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.6);
      border: 2px solid #fffbeb;
      margin-bottom: 20px;
    }
    .game-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fef08a 0%, #facc15 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
    }
    .game-subtitle {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
      max-width: 270px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: #fff;
      border: none;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 16px 44px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(14, 165, 233, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary:active {
      transform: scale(0.95);
      box-shadow: 0 0 40px rgba(14, 165, 233, 0.8);
    }
    .stat-badge {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 14px 28px;
      margin-bottom: 28px;
      display: flex;
      gap: 24px;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Top HUD / Scoreboard -->
    <div id="hud">
      <div class="hud-stat">
        <span class="hud-label">Score</span>
        <span id="score-text" class="hud-value score-val">0</span>
      </div>
      <button id="mute-toggle" class="mute-btn" aria-label="Toggle Sound">🔊</button>
      <div class="hud-stat" style="text-align: right;">
        <span class="hud-label">Best</span>
        <span id="high-score-text" class="hud-value high-val">0</span>
      </div>
    </div>

    <!-- 60FPS Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Transparent Bottom Thumb Touch Controls -->
    <div id="touch-controls">
      <button id="btn-left" class="touch-btn" aria-label="Move Left">
        <span class="touch-btn-icon">◀</span>
        <span class="touch-btn-sub">LEFT</span>
      </button>
      <button id="btn-right" class="touch-btn" aria-label="Move Right">
        <span class="touch-btn-icon">▶</span>
        <span class="touch-btn-sub">RIGHT</span>
      </button>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
      <div class="game-logo">★</div>
      <h1 class="game-title">COIN CATCHER</h1>
      <p class="game-subtitle">Catch golden coins before they touch the bottom floor! Tap thumb pads or drag to slide.</p>
      <div class="stat-badge">
        <div style="font-size: 28px;">🏆</div>
        <div style="text-align: left;">
          <div class="hud-label">High Score</div>
          <div id="start-high-score" class="hud-value high-val">0</div>
        </div>
      </div>
      <button id="start-btn" class="btn-primary">PLAY NOW</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h2 style="font-size: 32px; font-weight: 900; color: #ef4444; margin-bottom: 6px; letter-spacing: 0.05em;">GAME OVER</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">A golden coin touched the bottom floor!</p>
      <div class="stat-badge">
        <div style="text-align: center; border-right: 1px solid rgba(255,255,255,0.15); padding-right: 20px;">
          <div class="hud-label">Score</div>
          <div id="final-score" class="hud-value score-val">0</div>
        </div>
        <div style="text-align: center; padding-left: 6px;">
          <div class="hud-label">Best</div>
          <div id="final-high" class="hud-value high-val">0</div>
        </div>
      </div>
      <button id="restart-btn" class="btn-primary">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // Audio synthesis using browser Web Audio API (zero external assets required)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let isMuted = false;

    function getAudioCtx() {
      if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playPopSound() {
      if (isMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(820, now);
      osc.frequency.exponentialRampToValueAtTime(1300, now + 0.12);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.15);
    }

    function playGameOverSound() {
      if (isMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(310, now);
      osc.frequency.exponentialRampToValueAtTime(65, now + 0.52);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.56);
    }

    // Game variables & canvas setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 360, height = 640;
    let score = 0, highScore = parseInt(localStorage.getItem('coin_catcher_high_score') || '0', 10);
    let gameState = 'START';
    let basketX = 180, basketW = 84, basketH = 28, basketSpeed = 440;
    let keys = { left: false, right: false };
    let coins = [], particles = [], lastTime = performance.now();

    function updateScoreUI() {
      document.getElementById('score-text').textContent = score;
      document.getElementById('high-score-text').textContent = highScore;
      document.getElementById('start-high-score').textContent = highScore;
    }
    updateScoreUI();

    function resize() {
      const container = document.getElementById('game-container');
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      width = container.clientWidth || 360;
      height = container.clientHeight || 640;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.resetTransform?.();
      ctx.scale(dpr, dpr);
      basketX = width / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    function spawnCoin() {
      const pad = 28;
      const x = pad + Math.random() * (width - pad * 2);
      const speed = 210 + Math.min(score * 4, 200);
      coins.push({
        x, y: -22, radius: 16, speed,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() * 0.08 + 0.04) * (Math.random() > 0.5 ? 1 : -1)
      });
    }

    function addParticles(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const ang = (Math.PI * 2 * i) / 16 + (Math.random() * 0.4 - 0.2);
        const spd = Math.random() * 190 + 90;
        particles.push({
          x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 60,
          size: Math.random() * 3.5 + 2, color, alpha: 1
        });
      }
    }

    function startGame() {
      score = 0; coins = []; particles = [];
      basketX = width / 2;
      gameState = 'PLAYING';
      updateScoreUI();
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('gameover-overlay').style.display = 'none';
      lastTime = performance.now();
      spawnCoin();
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      playGameOverSound();
      if (navigator.vibrate) navigator.vibrate([60, 40, 100]);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('coin_catcher_high_score', highScore.toString());
      }
      document.getElementById('final-score').textContent = score;
      document.getElementById('final-high').textContent = highScore;
      document.getElementById('gameover-overlay').style.display = 'flex';
      updateScoreUI();
    }

    // Dual thumb buttons event listeners (touch & pointer support)
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const setKey = (k, v) => (e) => { e.preventDefault(); keys[k] = v; };

    ['pointerdown', 'touchstart'].forEach(ev => {
      btnLeft.addEventListener(ev, setKey('left', true), { passive: false });
      btnRight.addEventListener(ev, setKey('right', true), { passive: false });
    });
    ['pointerup', 'pointercancel', 'touchend'].forEach(ev => {
      btnLeft.addEventListener(ev, setKey('left', false), { passive: false });
      btnRight.addEventListener(ev, setKey('right', false), { passive: false });
    });

    // Mobile Direct Screen Drag
    canvas.addEventListener('touchmove', (e) => {
      if (gameState !== 'PLAYING') return;
      const t = e.touches[0];
      const r = canvas.getBoundingClientRect();
      basketX = Math.max(basketW / 2, Math.min(width - basketW / 2, t.clientX - r.left));
    }, { passive: true });

    // Keyboard support (Arrow keys or A/D)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === ' ' && gameState !== 'PLAYING') startGame();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('restart-btn').onclick = startGame;
    document.getElementById('mute-toggle').onclick = () => {
      isMuted = !isMuted;
      document.getElementById('mute-toggle').textContent = isMuted ? '🔇' : '🔊';
    };

    // Smooth requestAnimationFrame 60FPS Game Loop
    function loop(time) {
      const dt = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;

      if (gameState === 'PLAYING') {
        let dir = 0;
        if (keys.left) dir -= 1;
        if (keys.right) dir += 1;
        if (dir !== 0) {
          basketX += dir * basketSpeed * dt;
          basketX = Math.max(basketW / 2 + 4, Math.min(width - basketW / 2 - 4, basketX));
        }
      }

      // Draw dark cyber background
      ctx.fillStyle = '#070a13';
      ctx.fillRect(0, 0, width, height);

      // Bottom danger hazard line
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(10, height - 14);
      ctx.lineTo(width - 10, height - 14);
      ctx.stroke();
      ctx.setLineDash([]);

      const basketY = height - 76;

      // Update & Draw Coins
      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        if (gameState === 'PLAYING') {
          c.y += c.speed * dt;
          c.rot += c.rotSpeed;

          // Catch collision check
          if (c.x >= basketX - basketW / 2 - c.radius * 0.7 &&
              c.x <= basketX + basketW / 2 + c.radius * 0.7 &&
              c.y + c.radius >= basketY - basketH / 2 &&
              c.y - c.radius <= basketY + basketH / 2) {
            coins.splice(i, 1);
            score++;
            updateScoreUI();
            playPopSound();
            if (navigator.vibrate) navigator.vibrate(20);
            addParticles(c.x, basketY, '#fbbf24');
            spawnCoin();
            continue;
          }

          // Coin reached bottom floor -> GAME OVER
          if (c.y + c.radius >= height - 14) {
            triggerGameOver();
            break;
          }
        }

        // Render Coin with 3D elliptical rotation
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(Math.cos(c.rot), 1);
        ctx.shadowColor = '#eab308';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();
        ctx.strokeStyle = '#fffbeb';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.fillStyle = '#b45309';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('★', 0, 1);
        ctx.restore();
      }

      // Render Particle sparks
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 320 * dt;
        p.alpha -= dt * 1.5;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // Render Colorful Neon Basket
      ctx.save();
      ctx.translate(basketX, basketY);
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#06b6d4';
      ctx.beginPath();
      ctx.roundRect(-basketW / 2, -basketH / 2, basketW, basketH, 10);
      ctx.fill();
      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      // Neon accent line
      ctx.strokeStyle = '#f43f5e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-basketW * 0.35, 0); ctx.lineTo(basketW * 0.35, 0);
      ctx.stroke();
      ctx.restore();

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
